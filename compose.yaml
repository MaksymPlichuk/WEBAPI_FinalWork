services:
  caddy:
    image: caddy
    container_name: "caddy"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      -  "shop_nt"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
  db:
    image: postgres
    container_name: "db"
    environment:
      -  "POSTGRES_PASSWORD=qwerty"
      -  "POSTGRES_DB=docker_shop"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      -  "shop_db:/var/lib/postgresql"
    networks:
      -  "shop_nt"

  api:
    build: "back/"
    image: back
    container_name: "back"
    environment:
      -  "ConnectionStrings__DockerDb=User ID=postgres;Password=qwerty;Host=db;Port=5432;Database=docker_shop;"
      -  "EnableSwagger=true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      -  "shop_api:/app/Storage"
    networks:
      -  "shop_nt"

  front:
    build:
      context: "front/"
      args:
        VITE_BACK_URL: "http://13.50.14.8:7777"
    image: front
    container_name: "front"
    networks:
      -  "shop_nt"
  game:
    image: rmeira/chess
    container_name: "chess"
    networks:
      -  "shop_nt"

networks:
    shop_nt:
        name: "shop_nt"
volumes:
    shop_db:
      name: "shop_db"
    shop_api:
      name:  "shop_api"
    caddy_data:
      name: "caddy_data"
    caddy_config:
      name:  "caddy_config"
