services:
  db:
    image: postgres
    container_name: "db"
    ports:
      -  "5400:5432"
    environment:
      -  "POSTGRES_PASSWORD=qwerty"
      -  "POSTGRES_DB=docker_shop"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      -  "shop_db:/var/lib/postgresql"
    networks:
      -  "shop_nt"

  api:
    build: "back/"
    image: back
    container_name: "back"
    ports:
      -  "7777:8080"
    environment:
      -  "ConnectionStrings__DockerDb=User ID=postgres;Password=qwerty;Host=db;Port=5432;Database=docker_shop;"
      -  "EnableSwagger=true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      -  "shop_api:/app/Storage"
    networks:
      -  "shop_nt"

  front:
    build:
      context: "front/"
      args:
        VITE_BACK_URL: "http://localhost:7777"
    image: front
    container_name: "front"
    ports:
      -  "80:80"
networks:
    shop_nt:
        name: "shop_nt"
volumes:
    shop_db:
      name: "shop_db"
    shop_api:
      name:  "shop_api"
